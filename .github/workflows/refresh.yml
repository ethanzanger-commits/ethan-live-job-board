name: Refresh official job status
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/refresh_jobs.py
      - run: |
          git config user.name 'job-board-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/jobs.json
          git diff --cached --quiet || (git commit -m 'Refresh job status' && git push)
